<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Anti-Panic Button</title>
    <style>
        :root {
            --bg-color-1: #1e1e2f;
            --bg-color-2: #2a2b4d;
            --circle-color: #8fa0e4;
            --text-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2));
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Centered User Input Authorization Dock */
        .audio-dock {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .audio-dock label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--circle-color);
            cursor: pointer;
        }

        .container {
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .breathing-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .circle-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .breath-circle {
            width: 100px;
            height: 100px;
            background: var(--circle-color);
            border-radius: 50%;
            opacity: 0.3;
            box-shadow: 0 0 50px var(--circle-color);
            transition: all 4s linear;
        }

        .instruction {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            min-height: 2rem;
            transition: opacity 0.5s ease;
        }

        .grounding-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .grounding-btn:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.08);
        }

        .grounding-text {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            max-width: 80%;
            min-height: 3rem;
            line-height: 1.5;
        }

        .counter-badge {
            position: absolute;
            bottom: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }
        .counter-badge span {
            color: var(--circle-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Direct Input Slider Forces Firefox Core Sound Unblock -->
    <div class="audio-dock">
        <label for="volumeSlider">🌊 SOUND:</label>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="0">
    </div>

    <div class="container">
        <div class="breathing-section">
            <div class="circle-container">
                <div class="breath-circle" id="breathCircle"></div>
            </div>
            <div class="instruction" id="breathText">Loading...</div>
        </div>

        <button class="grounding-btn" id="groundingBtn">Press if you feel overwhelmed</button>
        <div class="grounding-text" id="groundingText"></div>
    </div>

    <div class="counter-badge">
        👁️ <span id="count">...</span> souls have rested here
    </div>

    <script>
        const circle = document.getElementById('breathCircle');
        const text = document.getElementById('breathText');
        
        const phases = [
            { text: "Breathe In", duration: 4000 },
            { text: "Hold", duration: 4000 },
            { text: "Breathe Out", duration: 4000 },
            { text: "Hold", duration: 4000 }
        ];
        
        let currentPhase = 0;

        function runBreathingLoop() {
            if (!circle || !text) return;
            const phase = phases[currentPhase];
            text.innerText = phase.text;
            
            if (currentPhase === 0) {
                circle.style.transform = "scale(2.2)";
                circle.style.opacity = "0.6";
            } else if (currentPhase === 2) {
                circle.style.transform = "scale(1)";
                circle.style.opacity = "0.2";
            }

            currentPhase = (currentPhase + 1) % phases.length;
            setTimeout(runBreathingLoop, phase.duration);
        }
        
        runBreathingLoop();

        const groundingPhrases = [
            "You are entirely safe right here in this room.",
            "Your thoughts are storms, but you are the sky. Let them pass.",
            "Bring your attention to your feet resting flat against the floor.",
            "Notice three things you can hear around you right now.",
            "There is nothing you need to fix or figure out at this exact moment.",
            "This feeling is uncomfortable, but it is temporary. It will pass."
        ];
        
        const groundBtn = document.getElementById('groundingBtn');
        const groundText = document.getElementById('groundingText');
        
        if (groundBtn && groundText) {
            groundBtn.addEventListener('click', () => {
                const randomPhrase = groundingPhrases[Math.floor(Math.random() * groundingPhrases.length)];
                groundText.innerText = randomPhrase;
            });
        }

        // Web Audio API Synthesis Unblock Pipeline 
        let audioCtx = null;
        let oscillator = null;
        let biquadFilter = null;
        let gainNode = null;
        const volumeSlider = document.getElementById('volumeSlider');

        function initSynth() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            biquadFilter = audioCtx.createBiquadFilter();
            gainNode = audioCtx.createGain();
            
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(55, audioCtx.currentTime); 
            
            biquadFilter.type = 'lowpass';
            biquadFilter.frequency.setValueAtTime(180, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime); 
            
            oscillator.connect(biquadFilter);
            biquadFilter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start(0);
        }

        if (volumeSlider) {
            volumeSlider.addEventListener('input', function(e) {
                // Initialize audio context on first slide event
                if (!audioCtx) {
                    initSynth();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                // Convert 0-100 slider range directly to safe gain limits
                const volumeLevel = e.target.value / 250; 
                gainNode.gain.setValueAtTime(volumeLevel, audioCtx.currentTime);
            });
        }

        function getVisitorCount() {
            fetch('https://mileshilliard.com')
                .then(res => res.json())
                .then(data => {
                    const countEl = document.getElementById('count');
                    if (countEl) countEl.innerText = data.value.toLocaleString();
                })
                .catch(() => {
                    const countEl = document.getElementById('count');
                    if (countEl) countEl.innerText = "1,556";
                });
        }
        
        window.addEventListener('DOMContentLoaded', getVisitorCount);
    </script>
</body>
</html>
