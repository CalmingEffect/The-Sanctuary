<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 60-Second Reset | A Quiet Space</title>

    <meta property="og:title" content="The 60-Second Reset">
    <meta property="og:description" content="A completely free, anonymous digital room to step back, breathe, and ground yourself. Zero tracking. Zero noise.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.io">
    <meta property="og:image" content="https://unsplash.com">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <style>
        :root {
            --bg-color-1: #1e1e2f;
            --bg-color-2: #2a2b4d;
            --circle-color: #8fa0e4;
            --text-color: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2));
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .top-dock {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
        .audio-dock {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .audio-dock label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }
        .volume-slider {
            appearance: none;
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--circle-color);
            cursor: pointer;
        }
        .container {
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        .circle-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .breath-circle {
            width: 100px;
            height: 100px;
            background: var(--circle-color);
            border-radius: 50%;
            opacity: 0.3;
            box-shadow: 0 0 50px var(--circle-color);
            transition: all 4s linear;
        }
        .instruction {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            min-height: 2rem;
            margin-top: 20px;
        }
        .grounding-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        .grounding-text {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            max-width: 80%;
            min-height: 3rem;
            line-height: 1.5;
            margin-top: 10px;
        }
        .counter-badge {
            position: absolute;
            bottom: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }
        .counter-badge span {
            color: var(--circle-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="top-dock">
        <div class="audio-dock">
            <label for="volumeSlider">🌊 SOUND:</label>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="0">
        </div>
    </div>

    <div class="container">
        <div class="circle-container">
            <div class="breath-circle" id="breathCircle"></div>
        </div>
        <div class="instruction" id="breathText">Loading...</div>
        <button class="grounding-btn" id="groundingBtn">Press if you feel overwhelmed</button>
        <div class="grounding-text" id="groundingText"></div>
    </div>

    <div class="counter-badge">
        👁️ <span id="count">...</span> souls have rested here
    </div>

    <script>
        const translations = {
            en: {
                in: "Breathe In", hold: "Hold", out: "Breathe Out",
                btn: "Press if you feel overwhelmed", souls: "souls have rested here",
                phrases: [
                    "You are entirely safe right here in this room.",
                    "Your thoughts are storms, but you are the sky. Let them pass.",
                    "Bring your attention to your feet resting flat against the floor.",
                    "There is nothing you need to fix or figure out at this exact moment.",
                    "This feeling is uncomfortable, but it is temporary. It will pass."
                ]
            },
            ko: {
                in: "숨을 들이마시세요", hold: "멈추세요", out: "숨을 내쉬세요",
                btn: "마음이 압도될 때 누르세요", souls: "명의 영혼들이 이곳에서 쉬어갔습니다",
                phrases: [
                    "당신은 이 방 안에서 완전히 안전합니다.",
                    "생각은 폭풍일 뿐이며 당신은 하늘입니다. 흘러가게 두세요.",
                    "바닥에 닿아 있는 당신의 발바닥에 집중해 보세요.",
                    "지금 이 순간 당신이 해결해야 할 일은 아무것도 없습니다.",
                    "이 느낌은 불편하지만 일시적입니다. 곧 지나갈 것입니다."
                ]
            },
            es: {
                in: "Inhala", hold: "Mantén", out: "Exhala",
                btn: "Presiona si te sientes abrumado", souls: "almas han descansado aquí",
                phrases: [
                    "Estás completamente a salvo aquí en esta habitación.",
                    "Tus pensamientos son tormentas, pero tú eres el cielo. Déjalos pasar.",
                    "Lleva tu atención a tus pies apoyados en el suelo.",
                    "No hay nada que necesites arreglar o resolver en este momento.",
                    "Este sentimiento es incómodo, pero es temporal. Pasará."
                ]
            }
        };

        let userLang = navigator.language || navigator.userLanguage || "en";
        userLang = userLang.substring(0, 2);
        const locale = translations[userLang] ? translations[userLang] : translations['en'];

        document.getElementById('groundingBtn').innerText = locale.btn;
        document.querySelector('.counter-badge').innerHTML = `👁️ <span id="count">...</span> ${locale.souls}`;

        const circle = document.getElementById('breathCircle');
        const text = document.getElementById('breathText');
        const phases = [
            { text: locale.in, duration: 4000 },
            { text: locale.hold, duration: 4000 },
            { text: locale.out, duration: 4000 },
            { text: locale.hold, duration: 4000 }
        ];
        let currentPhase = 0;

        function runBreathingLoop() {
            if (!circle || !text) return;
            const phase = phases[currentPhase];
            text.innerText = phase.text;
            if (currentPhase === 0) {
                circle.style.transform = "scale(2.2)";
                circle.style.opacity = "0.6";
            } else if (currentPhase === 2) {
                circle.style.transform = "scale(1)";
                circle.style.opacity = "0.2";
            }
            currentPhase = (currentPhase + 1) % phases.length;
            setTimeout(runBreathingLoop, phase.duration);
        }
        runBreathingLoop();

        const groundBtn = document.getElementById('groundingBtn');
        const groundText = document.getElementById('groundingText');
        if (groundBtn && groundText) {
            groundBtn.addEventListener('click', () => {
                const randomPhrase = locale.phrases[Math.floor(Math.random() * locale.phrases.length)];
                groundText.innerText = randomPhrase;
            });
        }

        let audioCtx = null, oscillator = null, biquadFilter = null, gainNode = null;
        const volumeSlider = document.getElementById('volumeSlider');

        function initSynth() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            biquadFilter = audioCtx.createBiquadFilter();
            gainNode = audioCtx.createGain();
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(55, audioCtx.currentTime); 
            biquadFilter.type = 'lowpass';
        }
