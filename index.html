<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sanctuary | A Quiet Space</title>
    <style>
        :root {
            --bg-color-1: #1e1e2f;
            --bg-color-2: #2a2b4d;
            --circle-color: #8fa0e4;
            --text-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2));
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .audio-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .audio-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .container {
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .breathing-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .circle-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .breath-circle {
            width: 100px;
            height: 100px;
            background: var(--circle-color);
            border-radius: 50%;
            opacity: 0.3;
            box-shadow: 0 0 50px var(--circle-color);
            transition: all 4s linear;
        }

        .instruction {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            min-height: 2rem;
            transition: opacity 0.5s ease;
        }

        .grounding-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .grounding-btn:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.08);
        }

        .grounding-text {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            max-width: 80%;
            min-height: 3rem;
            line-height: 1.5;
        }

        .counter-badge {
            position: absolute;
            bottom: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }
        .counter-badge span {
            color: var(--circle-color);
            font-weight: bold;
        }
        
        /* Keeps the player functional but invisible to preserve the calming space */
        #yt-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <button class="audio-toggle" id="audioToggle">🎵 Play Rain Sounds</button>

    <div class="container">
        <div class="breathing-section">
            <div class="circle-container">
                <div class="breath-circle" id="breathCircle"></div>
            </div>
            <div class="instruction" id="breathText">Loading...</div>
        </div>

        <button class="grounding-btn" id="groundingBtn">Press if you feel overwhelmed</button>
        <div class="grounding-text" id="groundingText"></div>
    </div>

    <div class="counter-badge">
        👁️ <span id="count">...</span> souls have rested here
    </div>

    <!-- Invisible background player stream -->
    <div id="yt-player"></div>

    <!-- Load the official YouTube Framework Script -->
    <script src="https://youtube.com"></script>

    <script>
        const circle = document.getElementById('breathCircle');
        const text = document.getElementById('breathText');
        
        const phases = [
            { text: "Breathe In", duration: 4000 },
            { text: "Hold", duration: 4000 },
            { text: "Breathe Out", duration: 4000 },
            { text: "Hold", duration: 4000 }
        ];
        
        let currentPhase = 0;

        function runBreathingLoop() {
            const phase = phases[currentPhase];
            text.innerText = phase.text;
            
            if (currentPhase === 0) {
                circle.style.transform = "scale(2.2)";
                circle.style.opacity = "0.6";
            } else if (currentPhase === 2) {
                circle.style.transform = "scale(1)";
                circle.style.opacity = "0.2";
            }

            currentPhase = (currentPhase + 1) % phases.length;
            setTimeout(runBreathingLoop, phase.duration);
        }
        
        runBreathingLoop();

        const groundingPhrases = [
            "You are entirely safe right here in this room.",
            "Your thoughts are storms, but you are the sky. Let them pass.",
            "Bring your attention to your feet resting flat against the floor.",
            "Notice three things you can hear around you right now.",
            "There is nothing you need to fix or figure out at this exact moment.",
            "This feeling is uncomfortable, but it is temporary. It will pass."
        ];
        
        const groundBtn = document.getElementById('groundingBtn');
        const groundText = document.getElementById('groundingText');
        
        groundBtn.addEventListener('click', () => {
            const randomPhrase = groundingPhrases[Math.floor(Math.random() * groundingPhrases.length)];
            groundText.innerText = randomPhrase;
        });

        // YouTube Audio Integration Integration Fix
        let player;
        let isPlaying = false;
        const audioToggle = document.getElementById('audioToggle');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '1',
                width: '1',
                videoId: 'mPZkdNFkNps', // 10 Hours of Gentle Rainfall Ambient Audio Track
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'mPZkdNFkNps'
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            audioToggle.addEventListener('click', function() {
                if (!isPlaying) {
                    player.playVideo();
                    audioToggle.innerText = "⏸️ Pause Rain";
                    isPlaying = true;
                } else {
                    player.pauseVideo();
                    audioToggle.innerText = "🎵 Play Rain Sounds";
                    isPlaying = false;
                }
            });
        }

        function getVisitorCount() {
            fetch('https://mileshilliard.com')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('count').innerText = data.value.toLocaleString();
                })
                .catch(() => {
                    document.getElementById('count').innerText = "1,514";
                });
        }
        
        window.addEventListener('DOMContentLoaded', getVisitorCount);
    </script>
</body>
</html>
