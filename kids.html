<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Kids Sanctuary</title>
    <style>
        :root {
            --bg-color-1: #1e1b4b;
            --bg-color-2: #311042;
            --circle-color: #38bdf8;
            --star-color: #fde047;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2));
            background-size: 400% 400%;
            animation: slowGradient 25s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        @keyframes slowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Large Child-Friendly Sound Control slider on top right */
        .audio-dock {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            padding: 14px 20px;
            border-radius: 40px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
        }

        .icon {
            font-size: 1.8rem;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 140px;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #a78bfa;
            border: 3px solid #fff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 60px;
            width: 100%;
            max-width: 600px;
        }

        /* Pure Visual Breathing Rhythm Ring */
        .breather-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .breather-ring {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #38bdf8 0%, rgba(56, 189, 248, 0.4) 70%, transparent 100%);
            border-radius: 50%;
            filter: blur(4px);
            box-shadow: 0 0 60px var(--circle-color);
            transition: all 4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Pop Button Sparks Interface */
        .pop-button {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #fde047 0%, #eab308 100%);
            border: 6px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(234, 179, 8, 0.4), inset 0 -4px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
            touch-action: manipulation;
        }

        .pop-button:active {
            transform: scale(0.85);
        }

        /* Floating Stars Container */
        .star {
            position: absolute;
            font-size: 2rem;
            color: var(--star-color);
            pointer-events: none;
            z-index: 50;
            animation: floatUp 2.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translate(0, 0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="audio-dock">
        <span class="icon">🌊</span>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="0">
    </div>

    <div class="container">
        <!-- Visual Pacing Ring (No Words) -->
        <div class="breather-wrapper">
            <div class="breather-ring" id="breatherRing"></div>
        </div>

        <!-- Big Magic Tactile Spawning Button -->
        <button class="pop-button" id="popButton">✨</button>
    </div>

    <script>
        // 1. Natural Pulse Loop (No Language Requirements)
        const ring = document.getElementById('breatherRing');
        let pulseState = 0;

        function runPulseLoop() {
            if (!ring) return;
            if (pulseState === 0) {
                ring.style.transform = "scale(2.4)";
                ring.style.opacity = "0.8";
                pulseState = 1;
            } else {
                ring.style.transform = "scale(0.9)";
                ring.style.opacity = "0.3";
                pulseState = 0;
            }
            setTimeout(runPulseLoop, 4000); // 4-second matching pulse window
        }
        runPulseLoop();

        // 2. Tactile Star Burst Generator for Grounding focus
        const popButton = document.getElementById('popButton');
        
        if (popButton) {
            popButton.addEventListener('click', (e) => {
                // Generate magical star elements on touch/click vectors
                for (let i = 0; i < 6; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.innerText = '⭐';
                    
                    // Center stars around button click origin point
                    const rect = popButton.getBoundingClientRect();
                    star.style.left = `${rect.left + rect.width / 2 - 16}px`;
                    star.style.top = `${rect.top + rect.height / 2 - 16}px`;
                    
                    // Assign random scatter pathways
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.floor(Math.random() * 120) + 60;
                    const x = Math.cos(angle) * distance;
                    const y = Math.sin(angle) * distance - 100; // Force float trending upwards
                    
                    star.style.setProperty('--x', `${x}px`);
                    star.style.setProperty('--y', `${y}px`);
                    
                    document.body.appendChild(star);
                    
                    // Clean up elements once animations finalize
                    setTimeout(() => star.remove(), 2500);
                }
            });
        }

        // 3. Audio Synthesis Handshake Core
        let audioCtx = null, oscillator = null, biquadFilter = null, gainNode = null;
        const volumeSlider = document.getElementById('volumeSlider');

        function initSynth() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            biquadFilter = audioCtx.createBiquadFilter();
            gainNode = audioCtx.createGain();
            
            // Soft warm humming frequency configuration
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(65, audioCtx.currentTime); 
            biquadFilter.type = 'lowpass';
            biquadFilter.frequency.setValueAtTime(140, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime); 
            oscillator.connect(biquadFilter);
            biquadFilter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start(0);
        }

        if (volumeSlider) {
            volumeSlider.addEventListener('input', function(e) {
                if (!audioCtx) initSynth();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                gainNode.gain.setValueAtTime(e.target.value / 200, audioCtx.currentTime);
            });
        }
    </script>
</body>
</html>
